<!doctype html>
<meta charset="utf-8">
<title>overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: flex; box-sizing: border-box; }
  #fade { position: relative; flex: none; width: 100%; height: 100%; }
  #stage { position: absolute; inset: 0; transform-origin: center; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #md { display: none; }
  #editFrame { display: none; position: fixed; inset: 0; box-sizing: border-box; border: 2px dashed #7c5cff; background: rgba(124,92,255,.07); cursor: move; }
  body.edit #editFrame { display: block; }
  #hint { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); max-width: 96%; display: flex; gap: 10px; align-items: center;
    padding: 5px 6px 5px 12px; border-radius: 8px; background: rgba(14,15,20,.92); color: #e8e9f0; font: 12px 'Segoe UI', system-ui, sans-serif; cursor: default; }
  #done { flex: none; border: 0; border-radius: 6px; padding: 4px 12px; background: #7c5cff; color: #fff; font: inherit; cursor: pointer; }
</style>
<div id="fade"><div id="stage"><canvas id="c"></canvas><canvas id="md"></canvas></div></div>
<div id="editFrame"><div id="hint"><span id="hintText"></span><button id="done"></button></div></div>
<script src="../node_modules/butterchurn/lib/butterchurn.min.js"></script>
<script src="../node_modules/butterchurn-presets/lib/butterchurnPresets.min.js"></script>
<script src="i18n.js"></script>
<script src="visualizers.js"></script>
<script src="visualizers2.js"></script>
<script src="overlay.js"></script>
